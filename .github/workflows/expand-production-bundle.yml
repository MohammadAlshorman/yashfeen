name: Expand production bundle

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand production bundle
        run: |
          rm -rf /tmp/yashfeen-bundle
          mkdir -p /tmp/yashfeen-bundle
          unzip -q Yashfeen_Production_Ready_Deploy.zip -d /tmp/yashfeen-bundle
          cp -R /tmp/yashfeen-bundle/. .
          rm -f Yashfeen_Production_Ready_Deploy.zip
          rm -f .github/workflows/expand-production-bundle.yml

      - name: Commit expanded application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand complete production application" || exit 0
          git push
